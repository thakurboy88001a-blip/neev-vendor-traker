<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEEV • Street Vendor Live Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--green:#16834a;--green2:#e6f5ec;--ink:#17211c;--muted:#6b7770;--line:#e3e9e5;--bg:#f5f8f6;--white:#fff;--blue:#eaf2ff;--shadow:0 8px 28px #1b35200d}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:1000}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px}.logo{width:38px;height:38px;background:var(--green);border-radius:12px;color:white;display:grid;place-items:center;font-size:20px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700}.top-actions{display:flex;align-items:center;gap:10px}.pill{background:var(--green2);color:var(--green);padding:7px 11px;border-radius:99px;font-size:12px;font-weight:700}.btn{padding:10px 14px;border-radius:11px;font-weight:700;background:var(--green);color:white}.btn.light{background:white;border:1px solid var(--line);color:var(--ink)}.btn.small{padding:7px 10px;font-size:12px}.layout{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 70px)}.sidebar{background:white;border-right:1px solid var(--line);padding:22px;overflow:auto;max-height:calc(100vh - 70px)}.heading{font-size:23px;font-weight:800;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.search{margin:20px 0 12px;position:relative}.search input{width:100%;padding:13px 13px 13px 40px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fbfcfb}.search span{position:absolute;left:14px;top:11px;font-size:18px;color:var(--muted)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.filter{padding:7px 12px;border-radius:99px;background:#f2f5f3;color:#536058;font-size:12px;font-weight:700}.filter.active{background:var(--green);color:white}.countline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:5px 0 10px}.vendor{display:flex;gap:12px;padding:14px 12px;border:1px solid var(--line);border-radius:15px;margin-bottom:10px;background:white;cursor:pointer;transition:.15s}.vendor:hover,.vendor.selected{border-color:#65ad83;background:#f6fcf8;box-shadow:0 3px 14px #16834a12}.foodicon{width:45px;height:45px;border-radius:12px;background:#fff4e5;display:grid;place-items:center;font-size:25px;flex-shrink:0}.vinfo{min-width:0;flex:1}.vname{font-weight:800;font-size:14px}.vmeta{color:var(--muted);font-size:12px;margin-top:3px}.status{font-size:10px;font-weight:800;color:var(--green);display:inline-flex;align-items:center;gap:5px;margin-top:7px}.dot{width:7px;height:7px;border-radius:50%;background:#25a45b;display:inline-block}.dot.off{background:#9aa49d}.eta{font-size:12px;font-weight:800;color:#425148;white-space:nowrap}.mapwrap{position:relative;min-height:550px}.mapbar{position:absolute;top:17px;left:17px;right:17px;z-index:500;display:flex;justify-content:space-between;pointer-events:none}.mapbar>*{pointer-events:auto}.maplabel{background:white;border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-weight:700;font-size:13px}.maptools{display:flex;gap:8px}.maptool{background:white;border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:13px;font-weight:700}.legend{position:absolute;bottom:20px;left:20px;z-index:500;background:white;border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);font-size:12px;color:#536058}.legend b{color:var(--ink)}#map{height:100%;min-height:550px;background:#e9efe9}.leaflet-popup-content-wrapper{border-radius:12px}.popup-title{font-weight:800;font-size:14px}.popup-meta{font-size:12px;color:#65716a;margin:4px 0 10px}.popup-btn{background:var(--green);color:white;border-radius:8px;padding:7px 10px;font-weight:700}.bottomnote{font-size:11px;color:#8a958e;text-align:center;margin:16px 0 5px}.mobile-tabs{display:none}.custom-marker{background:white;border:3px solid white;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;box-shadow:0 2px 8px #0003;font-size:19px}.custom-marker.off{filter:grayscale(1);opacity:.7}
@media(max-width:850px){.topbar{padding:0 14px;height:62px}.brand{font-size:16px}.top-actions .pill{display:none}.layout{grid-template-columns:1fr;min-height:auto}.sidebar{max-height:none;border-right:0;padding:16px;order:2}.mapwrap{order:1;min-height:52vh}#map{min-height:52vh}.mapbar{top:10px;left:10px;right:10px}.maplabel{font-size:11px;padding:8px}.maptools .maptool{font-size:11px;padding:8px}.legend{bottom:10px;left:10px;padding:9px;font-size:11px}.heading{font-size:20px}.vendor{padding:12px}.mobile-tabs{display:flex;justify-content:space-around;background:white;border-top:1px solid var(--line);padding:10px;position:sticky;bottom:0;z-index:900}.mobile-tabs button{background:transparent;color:var(--muted);font-size:12px;font-weight:700}.mobile-tabs button.active{color:var(--green)}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">📍</div><div>NEEV <small>SMART VENDOR NETWORK</small></div></div><div class="top-actions"><span class="pill">● DEMO MODE</span><button class="btn" id="addVendor">＋ Add Vendor</button></div></header>
<main class="layout"><aside class="sidebar"><h1 class="heading">Find street vendors</h1><div class="sub">अपने आसपास के चलते-फिरते दुकानदार खोजें</div>
<div class="search"><span>⌕</span><input id="search" placeholder="Search food, vendor, area…"></div>
<div class="filters"><button class="filter active" data-filter="all">All vendors</button><button class="filter" data-filter="active">🟢 Active</button><button class="filter" data-filter="inactive">Inactive</button></div>
<div class="countline"><span id="count">6 vendors nearby</span><span>Demo data ↗</span></div><div id="vendorList"></div><div class="bottomnote">NEEV • A student innovation for smarter local streets</div></aside>
<section class="mapwrap"><div class="mapbar"><div class="maplabel">🗺️ <span id="areaName">Nangloi · Delhi</span></div><div class="maptools"><button class="maptool" id="reset">◎ Reset map</button><button class="maptool" id="simulate">↻ Simulate movement</button></div></div><div id="map"></div><div class="legend"><b>Map legend</b><br>🟢 Active &nbsp; ⚪ Inactive<br><span id="movementText">Movement simulation: Off</span></div></section></main>
<nav class="mobile-tabs"><button class="active" id="tabMap">🗺️ Map</button><button id="tabVendors">☷ Vendors</button><button id="tabHome">⌂ Home</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// DEMO ONLY: sample locations around Nangloi, Delhi. No real vendor GPS is used.
const vendors=[
{id:1,name:'Raju Momos Corner',food:'Momos & snacks',emoji:'🥟',lat:28.6797,lng:77.0678,active:true,eta:4},
{id:2,name:'Sharma Fresh Fruits',food:'Fresh fruits',emoji:'🍎',lat:28.6812,lng:77.0712,active:true,eta:7},
{id:3,name:'Gupta Chaat Bhandar',food:'Chaat & golgappe',emoji:'🥙',lat:28.6767,lng:77.0642,active:true,eta:5},
{id:4,name:'Delhi Chai Point',food:'Tea & coffee',emoji:'☕',lat:28.6840,lng:77.0628,active:false,eta:null},
{id:5,name:'Shree Kulfi Wala',food:'Ice cream & kulfi',emoji:'🍦',lat:28.6738,lng:77.0730,active:true,eta:9},
{id:6,name:'Aman Veggie Cart',food:'Vegetables',emoji:'🥦',lat:28.6824,lng:77.0780,active:false,eta:null}
];
const map=L.map('map',{zoomControl:false}).setView([28.6798,77.0700],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const markers={};let activeFilter='all',selectedId=null,moving=false,timer=null;
function icon(v){return L.divIcon({className:'',html:`<div class="custom-marker ${v.active?'':'off'}">${v.emoji}</div>`,iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-18]})}
function popup(v){return `<div class="popup-title">${v.emoji} ${v.name}</div><div class="popup-meta">${v.food} · ${v.active?'🟢 Currently active':'⚪ Currently inactive'}</div>${v.active?`<b>Estimated arrival: ${v.eta} min</b>`:'<b>Vendor is currently inactive</b>'}<br><br><button class="popup-btn" onclick="selectVendor(${v.id})">View vendor</button>`}
vendors.forEach(v=>{const m=L.marker([v.lat,v.lng],{icon:icon(v)}).addTo(map).bindPopup(popup(v));markers[v.id]=m});
function render(){const q=document.getElementById('search').value.toLowerCase();const filtered=vendors.filter(v=>(activeFilter==='all'||(activeFilter==='active'?v.active:!v.active))&&(v.name.toLowerCase().includes(q)||v.food.toLowerCase().includes(q));document.getElementById('count').textContent=`${filtered.length} vendor${filtered.length===1?'':'s'} found`;
document.getElementById('vendorList').innerHTML=filtered.map(v=>`<article class="vendor ${selectedId===v.id?'selected':''}" onclick="selectVendor(${v.id})"><div class="foodicon">${v.emoji}</div><div class="vinfo"><div class="vname">${v.name}</div><div class="vmeta">${v.food}</div><div class="status"><i class="dot ${v.active?'':'off'}"></i>${v.active?'ACTIVE · Moving around':'INACTIVE'}</div></div><div class="eta">${v.active?`~${v.eta} min`:'—'}</div></article>`).join('');
Object.values(markers).forEach(m=>m.setOpacity(1));filtered.forEach(v=>markers[v.id].setOpacity(1));vendors.filter(v=>!filtered.includes(v)).forEach(v=>markers[v.id].setOpacity(.18));}
window.selectVendor=id=>{selectedId=id;const v=vendors.find(x=>x.id===id);render();map.flyTo([v.lat,v.lng],16,{duration:.6});markers[id].openPopup();};
document.getElementById('search').addEventListener('input',render);
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render()}));
document.getElementById('reset').onclick=()=>{map.flyTo([28.6798,77.0700],15);selectedId=null;render()};
document.getElementById('simulate').onclick=()=>{moving=!moving;document.getElementById('movementText').textContent=`Movement simulation: ${moving?'On':'Off'}`;document.getElementById('simulate').textContent=moving?'Ⅱ Pause simulation':'↻ Simulate movement';if(moving){timer=setInterval(()=>{vendors.filter(v=>v.active).forEach(v=>{v.lat+=(Math.random()-.5)*.00035;v.lng+=(Math.random()-.5)*.00035;markers[v.id].setLatLng([v.lat,v.lng]);});},2200)}else clearInterval(timer)};
document.getElementById('addVendor').onclick=()=>{const name=prompt('Demo vendor name?');if(!name)return;const food=prompt('What do they sell?','Street food')||'Street food';const v={id:Date.now(),name,food,emoji:'🛒',lat:28.6798+(Math.random()-.5)*.012,lng:77.0700+(Math.random()-.5)*.012,active:true,eta:Math.floor(Math.random()*8)+3};vendors.push(v);markers[v.id]=L.marker([v.lat,v.lng],{icon:icon(v)}).addTo(map).bindPopup(popup(v));render();selectVendor(v.id)};
document.getElementById('tabMap').onclick=()=>{document.getElementById('map').scrollIntoView({behavior:'smooth'});document.getElementById('tabMap').classList.add('active');document.getElementById('tabVendors').classList.remove('active')};document.getElementById('tabVendors').onclick=()=>{document.querySelector('.sidebar').scrollIntoView({behavior:'smooth'});document.getElementById('tabVendors').classList.add('active');document.getElementById('tabMap').classList.remove('active')};document.getElementById('tabHome').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'})};
render();setTimeout(()=>map.invalidateSize(),250);
</script>
</body></html>
